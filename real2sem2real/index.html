<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Real2Sem2Real video</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{--bg:#ffffff;--ink:#222}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111;--ink:#ddd}}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:16px}
  video{display:block;width:min(100%, calc((100vh - 80px) * 16 / 9), 1600px);aspect-ratio:16/9;background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
  p{font-size:13px;opacity:.6}
</style>
</head>
<body>
<video controls playsinline preload="metadata" poster="poster.jpg?v=1">
  <source src="video.mp4?v=1" type="video/mp4">
</video>
<p>Real2Sem2Real supplementary video, draft</p>
</body>
</html>
