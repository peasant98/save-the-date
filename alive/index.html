<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Anisha &amp; Matt — the scene, awake</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16223c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lab/scene.css">
</head>
<body>

<div id="viewport"></div>
<div id="vignette"></div>
<div id="hint">move to look around</div>
<button id="toggle">see it by day</button>
<div id="caption">
  <div class="script">the woods, awake</div>
  <div class="sub">Anisha &amp; Matt &middot; August 5&ndash;7 &middot; 2027</div>
</div>

<script type="module">
import { mount } from '/lab/page.js';

/* everything on: wind through the canopy, mist off the lawn, fireflies and
   rising embers at night, dust and falling leaves by day, and a camera that
   tours the scene on its own until you take it */
mount({
  amp: [0.042, 0.027],
  hint: { pointer: 'move to take the camera', touch: 'drag to take the camera' },
  /* [x, y, dolly] — hard left and right is where the parallax lives */
  tour: [
    [ 0.00,  0.00,  0.00],
    [-0.95, -0.20,  0.25],
    [-0.55,  0.55,  0.70],
    [ 0.35,  0.25,  0.30],
    [ 0.95, -0.15,  0.00],
    [ 0.45, -0.55, -0.35],
    [-0.20,  0.10, -0.15],
  ],
  tourDolly: 0.022,
  wind: 0.42,
  fog: 0.85,
  swarm: 85,
  drifters: 26,
  captions: { night: 'the woods, awake', day: 'the lawn, awake' },
});
</script>
</body>
</html>
