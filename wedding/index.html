const STORE = 'am-wedding-code';
const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

/* fetch the hero photo while the guest types, so the page opens straight onto it */
const pre = document.createElement('link');
pre.rel = 'prefetch'; pre.as = 'image';
pre.href = matchMedia('(max-aspect-ratio: 4/5)').matches ? 'media/hero-tall.jpg' : 'media/hero-wide.jpg';
document.head.appendChild(pre);

async function unlock(code){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITERATIONS, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  for (const p of PAYLOADS){
    try { return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(p.iv) }, key, bytes(p.ct))); }
    catch (e) { /* wrong code for this payload */ }
  }
  return null;
}
function show(html){ document.open(); document.write(html); document.close(); }

const form = document.getElementById('gate'), input = document.getElementById('code'), msg = document.getElementById('msg');
form.addEventListener('submit', async e => {
  e.preventDefault();
  const button = form.querySelector('button');
  button.disabled = true; button.textContent = 'Opening…'; msg.textContent = '';
  const html = await unlock(input.value);
  if (html){
    try { localStorage.setItem(STORE, input.value); } catch (err) {}
    show(html);
  } else {
    msg.textContent = 'That code doesn’t match. Please check it and try again.';
    button.disabled = false; button.textContent = 'Enter'; input.select();
  }
});

if (!window.crypto || !crypto.subtle){
  msg.textContent = 'Please open this page at https://anishamatt.com/wedding/';
} else {
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved){
    document.body.classList.add('auto');
    unlock(saved).then(html => {
      if (html) return show(html);
      try { localStorage.removeItem(STORE); } catch (e) {}
      document.body.classList.remove('auto');
    });
  }
}
})();
</script>
